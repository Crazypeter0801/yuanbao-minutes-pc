<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记笔记星标 · GIF 与矢量动画对照</title>
<style>
  body { margin: 0; padding: 40px; font-family: -apple-system, "PingFang SC", sans-serif; color: #1a1a1a; background: #f5f7fc; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 24px; color: #7b818f; font-size: 13px; line-height: 20px; }
  .row { display: flex; align-items: flex-end; margin-bottom: 28px; }
  .row > * + * { margin-left: 36px; }
  .cell { text-align: center; font-size: 12px; color: #7b818f; }
  .cell img { display: block; margin: 0 auto 8px; }
  .label { width: 120px; font-size: 13px; color: #1a1a1a; align-self: center; }
  .pixel { image-rendering: pixelated; }
  .sheet { max-width: 100%; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
  <h1>「元宝正在记笔记」星标</h1>
  <p>上排：企业微信表情原 GIF（36×36 位图，放大后发糊）。下排：note-star.svg（矢量 SMIL 动画，15KB，任意尺寸清晰）。两者同为 1.8s 一圈。</p>
  <div class="row">
    <div class="label">原 GIF</div>
    <div class="cell"><img src="original.gif" width="16" height="16">16px</div>
    <div class="cell"><img src="original.gif" width="36" height="36">36px</div>
    <div class="cell"><img class="pixel" src="original.gif" width="96" height="96">96px</div>
    <div class="cell"><img class="pixel" src="original.gif" width="200" height="200">200px</div>
  </div>
  <div class="row">
    <div class="label">矢量 SVG</div>
    <div class="cell"><img src="note-star.svg" width="16" height="16">16px</div>
    <div class="cell"><img src="note-star.svg" width="36" height="36">36px</div>
    <div class="cell"><img src="note-star.svg" width="96" height="96">96px</div>
    <div class="cell"><img src="note-star.svg" width="200" height="200">200px</div>
  </div>
  <p>逐帧对照（每两行一组：上 GIF，下 SVG，共 45 帧）：</p>
  <img class="sheet" src="frame-compare.png" width="486">
</body>
</html>
